#:schema ./terms.schema.json

# Shared vocabulary for whetstone-envs. Definitions remain conceptual; public
# implementation mappings belong only in exported_symbols.

[[terms]]
name = "task instance"
definition = """
A single generated evaluation problem within a task family, carrying a stable \
identifier, generation seed, one or more instance categories, public prompt inputs, \
and private gold data."""
exported_symbols = [
    "whetstone_envs.instances.Instance",
]

[[terms]]
name = "instance group"
definition = """
A named, ordered, immutable collection of task instances with unique \
identifiers. An instance group may be empty."""
exported_symbols = ["whetstone_envs.instances.InstanceGroup"]

[[terms]]
name = "instance category"
definition = """
A nonblank label grouping task instances for split allocation and score \
reporting. One task instance may belong to several instance categories."""

[[terms]]
name = "public prompt identity"
definition = """
The canonical identity of the information exposed by the default prompt \
boundary: the sorted key-value pairs in a task instance's prompt inputs. It \
excludes identifier, seed, instance categories, and gold, and it is not rendered-prompt \
identity."""
exported_symbols = ["whetstone_envs.instances.Instance.public_prompt_identity"]

[[terms]]
name = "instance pool"
definition = """
A source for evaluation splits containing one named instance group with \
unique public prompt identities."""
exported_symbols = ["whetstone_envs.instances.InstancePool"]

[[terms]]
name = "instance pool split"
definition = """
A source instance pool and an ordered collection of named groups allocated \
from it, with lookup by group name. Group names are unique, instances match \
the source pool, and identifiers are disjoint across groups; allocation need \
not exhaust the pool."""
exported_symbols = ["whetstone_envs.instances.InstancePoolSplit"]

[[terms]]
name = "probe pair"
definition = """
A naive floor template and a known-good ceiling template applied to the same \
task instance through one renderer."""
exported_symbols = [
    "whetstone_envs.probes.ProbePair",
    "whetstone_envs.probes.render_with_prompt_inputs",
]

[[terms]]
name = "prediction normalization"
definition = """
The idempotent removal of surrounding whitespace and complete outer \
triple-backtick fences from evaluation text before exact-match comparison. \
Unmatched fences and internal backticks remain part of the text."""
exported_symbols = ["whetstone_envs.probes.normalize"]

[[terms]]
name = "evaluation observation"
definition = """
One task-repeat result classified as scored, failed, or missing. A scored \
observation carries a binary score; failed and missing observations carry no \
score."""
exported_symbols = [
    "whetstone_envs.scoring.Observation",
    "whetstone_envs.scoring.Outcome",
    "whetstone_envs.scoring.scored",
    "whetstone_envs.scoring.failed",
    "whetstone_envs.scoring.missing",
]

[[terms]]
name = "score aggregate"
definition = """
A task, category, or overall result containing an equal-weighted mean when \
complete, contribution counts, and any child aggregates."""
exported_symbols = [
    "whetstone_envs.scoring.Aggregate",
    "whetstone_envs.scoring.aggregate",
    "whetstone_envs.scoring.aggregate_task",
    "whetstone_envs.scoring.aggregate_category",
    "whetstone_envs.scoring.aggregate_overall",
]

[[terms]]
name = "exact-match score"
definition = """
A binary score that is one only when a prediction and the private gold value \
are exactly equal after prediction normalization is applied independently to \
both, and zero otherwise."""
exported_symbols = ["whetstone_envs.scoring.exact_match"]

[[terms]]
name = "family scorer registry"
definition = """
The single owner of how one task family's generation becomes a score, keyed by \
the family name a persisted report carries, holding only the pure scoring rule \
so that both an evaluation run and a report consumer apply the identical rule \
without either needing the optimizer stack."""
exported_symbols = [
    "whetstone_envs.scoring.FAMILY_SCORERS",
    "whetstone_envs.scoring.FamilyScorer",
    "whetstone_envs.scoring.family_score",
    "whetstone_envs.scoring.scorable_family_ids",
]

[[terms]]
name = "pool manifest"
definition = """
A persisted description of a generated instance pool recording its generator \
version, retained seed range, per-category counts, versioned canonical pool \
identity, and schema version for reproducibility and drift detection."""
exported_symbols = [
    "whetstone_envs.manifests.Manifest",
    "whetstone_envs.manifests.content_hash",
    "whetstone_envs.manifests.MANIFEST_SCHEMA_VERSION",
]

[[terms]]
name = "C11 task family"
definition = """
An evaluation task family for RFC 8785 JSON canonicalization spanning \
whitespace, key ordering, number rendering, Unicode escaping, and mixed cases, \
with deterministic generation, standard cohort sizes, a naive-and-known-good \
probe pair, and a reproducibility manifest."""
exported_symbols = [
    "whetstone_envs.c11.C11Category",
    "whetstone_envs.c11.DEFAULT_SPLIT_SIZES",
    "whetstone_envs.c11.PROBES",
    "whetstone_envs.c11.build_manifest",
    "whetstone_envs.c11.generate_pool",
]

[[terms]]
name = "RFC 8785 canonicalization"
definition = """
The transformation of a JSON text into the single RFC 8785 representation \
defined by recursive UTF-16 object-name ordering and canonical whitespace, \
string, and finite binary64 number forms."""
exported_symbols = ["whetstone_envs.c11.canonicalize"]

[[terms]]
name = "C18 task family"
definition = """
An evaluation task family for fictional-ontology deductive entailment across \
multiple reasoning depths and distractor policies, with independently checked \
labels, naive-and-known-good probes, standard cohort sizes, and reproducibility \
manifests."""
exported_symbols = [
    "whetstone_envs.c18.DEFAULT_CONFIG",
    "whetstone_envs.c18.HARD_CONFIG",
    "whetstone_envs.c18.PROBES",
    "whetstone_envs.c18.DepthCategory",
    "whetstone_envs.c18.DistractorMode",
    "whetstone_envs.c18.GenerationConfig",
    "whetstone_envs.c18.SplitPlan",
    "whetstone_envs.c18.build_manifest",
    "whetstone_envs.c18.default_split_sizes",
    "whetstone_envs.c18.generate_pool",
    "whetstone_envs.c18.score_gold",
]

[[terms]]
name = "C19 task family"
definition = """
An evaluation task family for complete-script MiniGrid state transitions \
spanning navigation, object manipulation, and door interaction at standard \
world sizes, with deterministic generation, standard cohort sizes, a \
naive-and-known-good probe pair, and a reproducibility manifest."""
exported_symbols = [
    "whetstone_envs.c19.C19Scenario",
    "whetstone_envs.c19.C19Size",
    "whetstone_envs.c19.DEFAULT_SPLIT_SIZES",
    "whetstone_envs.c19.PROBES",
    "whetstone_envs.c19.build_manifest",
    "whetstone_envs.c19.generate_pool",
]

[[terms]]
name = "C19 state transition"
definition = """
The evolution of supported answer-relevant physical grid-world state under an \
ordered action script, from which a requested final-state fact is derived \
after every action has been applied."""
exported_symbols = [
    "whetstone_envs.c19.Action",
    "whetstone_envs.c19.C19Fact",
    "whetstone_envs.c19.derive_fact",
]

[[terms]]
name = "C22 task family"
definition = """
An evaluation task family for satisfying composed deterministic instruction \
constraints, with fixed default and hard pools, a naive-and-known-good probe \
pair, closed private gold, all-pass scoring, and reproducibility manifests."""
exported_symbols = [
    "whetstone_envs.c22.PROBES",
    "whetstone_envs.c22.Preset",
    "whetstone_envs.c22.generate_pool",
    "whetstone_envs.c22.load_manifest",
    "whetstone_envs.c22.score",
]

[[terms]]
name = "C23 task family"
definition = """
An evaluation task family for single-rule subregular string induction across \
ISL k=2, left-OSL k=2, right-OSL k=2, and ISL k=3, with determinate held-out \
query outputs, a naive-and-known-good probe pair, exact scoring, standard \
cohort sizes, and a reproducibility manifest."""
exported_symbols = [
    "whetstone_envs.c23.GENERATOR_VERSION",
    "whetstone_envs.c23.PROBES",
    "whetstone_envs.c23.default_split_sizes",
    "whetstone_envs.c23.generate_pool",
    "whetstone_envs.c23.score_gold",
]

[[terms]]
name = "optimizer adapter extra"
definition = """
An optional whetstone_envs.optim surface that maps task-family pools, probe \
pairs, and exact-match scoring onto whetstone-ai experiment rows without \
importing whetstone-ai from core environment packages."""
exported_symbols = [
    "whetstone_envs.optim.ExactMatchEvalProcedureRunner",
    "whetstone_envs.optim.TaskRow",
    "whetstone_envs.optim.task_row_from_instance",
    "whetstone_envs.optim.task_rows_from_instances",
]

[[terms]]
name = "evaluation report"
definition = """
A bounded, atomically published, versioned canonical JSON debugging artifact \
that retains normalized candidates and tasks plus candidate-major C19 \
observations, exact accounting, aggregate evidence, prompts, outputs, private \
gold, safe typed provider-failure metadata, and component traces without raw \
provider messages, credentials, or SQLite content."""
exported_symbols = [
    "whetstone_envs.evidence.EVAL_REPORT_SCHEMA",
    "whetstone_envs.evidence.EvalReport",
]

[[terms]]
name = "optimization trajectory report"
definition = """
A bounded, atomically published, versioned canonical JSON projection of an \
exact terminal optimization result, preserving ordered steps and resolutions, \
full candidate payloads and mutation text, per-step budget deltas, cumulative \
budget state, and exact hydrated evaluation reports for offline debugging."""
exported_symbols = [
    "whetstone_envs.evidence.TRAJECTORY_REPORT_SCHEMA",
    "whetstone_envs.evidence.TrajectoryReport",
]

[[terms]]
name = "self-contained HTML report"
definition = """
A deterministic, portable, offline presentation derived only from one strict \
evaluation or optimization trajectory report plus packaged trusted assets. It \
is replaceable from its authoritative JSON source, contains private debugging \
data, and defines no persistence or interchange schema."""

[[terms]]
name = "standalone evaluation"
definition = """
Execution of named C19 candidates against a selected task split with repeated \
evaluations, configured provider transport, runtime storage, and portable \
evidence publication."""
exported_symbols = [
    "whetstone_envs.evaluation.spec.CandidateInput",
    "whetstone_envs.evaluation.spec.C19EvalSpec",
    "whetstone_envs.evaluation.run.EvalRunOutput",
    "whetstone_envs.evaluation.run.run_c19_evaluation",
]

[[terms]]
name = "runtime evidence extraction"
definition = """
Reading and validating persisted Whetstone evaluation and optimizer records, \
then translating them into portable evaluation and trajectory reports without \
executing candidates or publishing files."""
exported_symbols = [
    "whetstone_envs.optim.extraction.evaluation.EvaluationCandidate",
    "whetstone_envs.optim.extraction.evaluation.project_eval_report",
    "whetstone_envs.optim.extraction.trajectory.project_trajectory_report",
]

[[terms]]
name = "run artifact directory"
definition = """
A resolved directory outside detected Git repositories holding execution \
outputs, with a shared default location and a failure boundary preserving \
the directory for inspection."""
exported_symbols = [
    "whetstone_envs.artifacts.DEFAULT_OUTPUT_ROOT",
    "whetstone_envs.artifacts.DurableRunError",
    "whetstone_envs.artifacts.default_output_dir",
    "whetstone_envs.artifacts.durable_run_boundary",
    "whetstone_envs.artifacts.prepare_output_root",
    "whetstone_envs.artifacts.validate_output_root",
]
