#:schema ./terms.schema.json

# Shared vocabulary for whetstone-envs. Definitions remain conceptual; public
# implementation mappings belong only in exported_symbols.

[[terms]]
name = "task instance"
definition = """
A single generated evaluation task carrying a stable identifier, generation \
seed, one or more task strata, public prompt inputs, and private gold data."""
exported_symbols = [
    "whetstone_envs.instances.Instance",
    "whetstone_envs.instances.make_instance",
]

[[terms]]
name = "task stratum"
definition = """
A nonblank label grouping task instances for split allocation and score \
reporting. One task instance may belong to several task strata."""

[[terms]]
name = "public prompt identity"
definition = """
The canonical identity of the information exposed by the default prompt \
boundary: the sorted key-value pairs in a task instance's prompt inputs. It \
excludes identifier, seed, task strata, and gold, and it is not rendered-prompt \
identity."""
exported_symbols = ["whetstone_envs.instances.public_prompt_identity"]

[[terms]]
name = "task pool"
definition = """
An ordered collection of task instances with unique identifiers and unique \
public prompt identities, used as the source for evaluation splits."""
exported_symbols = ["whetstone_envs.pools.TaskPool"]

[[terms]]
name = "pool split"
definition = """
The internal-evaluation, official, and held-out subsets selected from a task \
pool. Task-instance identifiers are disjoint across the three destinations."""
exported_symbols = ["whetstone_envs.pools.PoolSplit"]

[[terms]]
name = "probe pair"
definition = """
A naive floor template and a known-good ceiling template applied to the same \
task instance through one renderer."""
exported_symbols = [
    "whetstone_envs.probes.ProbePair",
    "whetstone_envs.probes.render_with_prompt_inputs",
]

[[terms]]
name = "prediction normalization"
definition = """
The idempotent removal of surrounding whitespace and complete outer \
triple-backtick fences from evaluation text before exact-match comparison. \
Unmatched fences and internal backticks remain part of the text."""
exported_symbols = ["whetstone_envs.probes.normalize"]

[[terms]]
name = "evaluation observation"
definition = """
One task-repeat result classified as scored, failed, or missing. A scored \
observation carries a binary score; failed and missing observations carry no \
score."""
exported_symbols = [
    "whetstone_envs.scoring.Observation",
    "whetstone_envs.scoring.Outcome",
    "whetstone_envs.scoring.scored",
    "whetstone_envs.scoring.failed",
    "whetstone_envs.scoring.missing",
]

[[terms]]
name = "score aggregate"
definition = """
A task, task-stratum, or overall result containing an equal-weighted mean when \
complete, contribution counts, and any child aggregates."""
exported_symbols = [
    "whetstone_envs.scoring.Aggregate",
    "whetstone_envs.scoring.aggregate",
    "whetstone_envs.scoring.aggregate_task",
    "whetstone_envs.scoring.aggregate_stratum",
    "whetstone_envs.scoring.aggregate_overall",
]

[[terms]]
name = "exact-match score"
definition = """
A binary score that is one only when a prediction and the private gold value \
are exactly equal after prediction normalization is applied independently to \
both, and zero otherwise."""
exported_symbols = ["whetstone_envs.scoring.exact_match"]

[[terms]]
name = "pool manifest"
definition = """
A persisted description of a generated task pool recording its generator \
version, retained seed range, per-stratum counts, versioned canonical pool \
identity, and schema version for reproducibility and drift detection."""
exported_symbols = [
    "whetstone_envs.manifests.Manifest",
    "whetstone_envs.manifests.content_hash",
    "whetstone_envs.manifests.MANIFEST_SCHEMA_VERSION",
]

[[terms]]
name = "C11 task family"
definition = """
An evaluation task family for RFC 8785 JSON canonicalization spanning \
whitespace, key ordering, number rendering, Unicode escaping, and mixed cases, \
with deterministic generation, standard cohort sizes, a naive-and-known-good \
probe pair, and a reproducibility manifest."""
exported_symbols = [
    "whetstone_envs.c11.C11Stratum",
    "whetstone_envs.c11.DEFAULT_SPLIT_SIZES",
    "whetstone_envs.c11.PROBES",
    "whetstone_envs.c11.build_manifest",
    "whetstone_envs.c11.generate_pool",
]

[[terms]]
name = "RFC 8785 canonicalization"
definition = """
The transformation of a JSON text into the single RFC 8785 representation \
defined by recursive UTF-16 object-name ordering and canonical whitespace, \
string, and finite binary64 number forms."""
exported_symbols = ["whetstone_envs.c11.canonicalize"]

[[terms]]
name = "C18 task family"
definition = """
An evaluation task family for fictional-ontology deductive entailment across \
multiple reasoning depths and distractor policies, with independently checked \
labels, naive-and-known-good probes, standard cohort sizes, and reproducibility \
manifests."""
exported_symbols = [
    "whetstone_envs.c18.DEFAULT_CONFIG",
    "whetstone_envs.c18.HARD_CONFIG",
    "whetstone_envs.c18.PROBES",
    "whetstone_envs.c18.DepthStratum",
    "whetstone_envs.c18.DistractorMode",
    "whetstone_envs.c18.GenerationConfig",
    "whetstone_envs.c18.SplitPlan",
    "whetstone_envs.c18.build_manifest",
    "whetstone_envs.c18.default_split_sizes",
    "whetstone_envs.c18.generate_pool",
    "whetstone_envs.c18.score_gold",
]

[[terms]]
name = "C22 task family"
definition = """
An evaluation task family for satisfying composed deterministic instruction \
constraints, with fixed default and hard pools, a naive-and-known-good probe \
pair, closed private gold, all-pass scoring, and reproducibility manifests."""
exported_symbols = [
    "whetstone_envs.c22.PROBES",
    "whetstone_envs.c22.Preset",
    "whetstone_envs.c22.generate_pool",
    "whetstone_envs.c22.load_manifest",
    "whetstone_envs.c22.score",
]

[[terms]]
name = "C23 task family"
definition = """
An evaluation task family for single-rule subregular string induction across \
ISL k=2, left-OSL k=2, right-OSL k=2, and ISL k=3, with determinate held-out \
query outputs, a naive-and-known-good probe pair, exact scoring, standard \
cohort sizes, and a reproducibility manifest."""
exported_symbols = [
    "whetstone_envs.c23.GENERATOR_VERSION",
    "whetstone_envs.c23.PROBES",
    "whetstone_envs.c23.default_split_sizes",
    "whetstone_envs.c23.generate_pool",
    "whetstone_envs.c23.score_gold",
]

[[terms]]
name = "C19 task family"
definition = """
An evaluation task family for complete-script MiniGrid state transitions \
spanning navigation, object manipulation, and door interaction at standard \
world sizes, with deterministic generation, standard cohort sizes, a \
naive-and-known-good probe pair, and a reproducibility manifest."""
exported_symbols = [
    "whetstone_envs.c19.C19Scenario",
    "whetstone_envs.c19.C19Size",
    "whetstone_envs.c19.DEFAULT_SPLIT_SIZES",
    "whetstone_envs.c19.PROBES",
    "whetstone_envs.c19.build_manifest",
    "whetstone_envs.c19.generate_pool",
]

[[terms]]
name = "C19 state transition"
definition = """
The evolution of supported answer-relevant physical grid-world state under an \
ordered action script, from which a requested final-state fact is derived \
after every action has been applied."""
exported_symbols = [
    "whetstone_envs.c19.Action",
    "whetstone_envs.c19.C19Fact",
    "whetstone_envs.c19.derive_fact",
]
