name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: "3.12"
      - run: uv sync
      # NLTK ships tokenizer models separately from the Python package.
      # The vendored IFEval test suite exercises word/sentence constraints
      # that require this resource on a clean runner.
      - name: Provision NLTK tokenizer data
        env:
          NLTK_DATA: ${{ runner.temp }}/nltk_data
        run: uv run python -m nltk.downloader -d "$NLTK_DATA" punkt_tab
      - run: uv run ruff check .
      # Fast tier: the `slow` marker (full-N PrOntoQA regeneration) is
      # deselected by default via addopts in pyproject.toml.
      - run: uv run pytest
        env:
          NLTK_DATA: ${{ runner.temp }}/nltk_data

  slow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: "3.12"
      - run: uv sync
      # The slow tier is deselected from the default run; this job runs ONLY
      # it (`-m slow`) so deselected-by-default never means never-run.
      - run: uv run pytest -m slow
