[project]
name = "whetstone-envs"
version = "0.2.15"
description = "Reproducible quick-test environment contracts and task families."
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = [
    "LICENSE",
    "src/whetstone_envs/c18/_vendor/prontoqa/LICENSE",
    "src/whetstone_envs/c18/_vendor/prontoqa/PROVENANCE.md",
    "src/whetstone_envs/c22/_vendor/instruction_following_eval/LICENSE",
    "src/whetstone_envs/c22/_vendor/instruction_following_eval/PROVENANCE.md",
    "src/whetstone_envs/c23/attribution/LICENSE",
    "src/whetstone_envs/c23/attribution/PROVENANCE.md",
    "src/whetstone_envs/gsm8k/attribution/LICENSE",
    "src/whetstone_envs/gsm8k/attribution/PROVENANCE.md",
    "src/whetstone_envs/ifeval/attribution/LICENSE",
    "src/whetstone_envs/ifeval/attribution/PROVENANCE.md",
]
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "absl-py==2.5.0",
    "dr-graph==0.1.3",
    "dr-serialize==0.1.2",
    "dr-store==0.2.7",
    "gymnasium==1.3.0",
    "immutabledict==4.3.1",
    "langdetect==1.0.9",
    "minigrid==3.1.0",
    "nltk==3.10.0",
    "numpy==2.5.1",
    "pydantic==2.14.1",
    "rfc8785==0.1.4",
    "rich>=15.0.0",
]

[project.scripts]
whetstone-eval = "whetstone_envs.reporting.cli:main"

[project.optional-dependencies]
c18 = ["numpy==2.5.1", "scipy==1.18.0"]
optim = [
    "rich==15.0.0",
    "whetstone-ai==0.1.19; python_version >= '3.13' and python_version < '3.15'",
]

[project.urls]
Repository = "https://github.com/danielle-rothermel/whetstone-envs"
Issues = "https://github.com/danielle-rothermel/whetstone-envs/issues"
Documentation = "https://danielle-rothermel.github.io/whetstone-envs/"
Changelog = "https://github.com/danielle-rothermel/whetstone-envs/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "actionlint-py==1.7.12.24",
    "pre-commit>=4.6.0",
    "ruff>=0.15.18",
    "ty>=0.0.51",
]

[tool.uv]
required-version = "==0.12.3"

[tool.hatch.build.targets.sdist]
only-include = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/whetstone_envs"]
artifacts = [
    "src/whetstone_envs/c23/attribution/LICENSE",
    "src/whetstone_envs/c23/attribution/PROVENANCE.md",
    "src/whetstone_envs/c23/manifest.json",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
include = ["examples/**/*.py", "scripts/**/*.py", "src/**/*.py", "tests/**/*.py"]
extend-exclude = [
    "src/whetstone_envs/c18/_vendor/**",
    "src/whetstone_envs/c22/_vendor/**",
]
line-length = 79

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "E",
    "F",
    "FA",
    "FBT",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "PT",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLOT",
    "T10",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = ["PLR1711", "S101", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT009", "PT027", "S603"]
"src/whetstone_envs/c18/probes.py" = ["E501"]
"src/whetstone_envs/c22/generation.py" = ["S311"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = ["dataclasses.dataclass"]
runtime-evaluated-base-classes = [
    "whetstone_envs.optim.spec._RunInput",
    "whetstone_envs.evidence._models._StrictModel",
]

[tool.ty.src]
include = ["examples", "scripts", "src", "tests"]
exclude = [
    "src/whetstone_envs/c18/_vendor/**",
    "src/whetstone_envs/c22/_vendor/**",
]

[[tool.ty.overrides]]
# The optional runtime packages import whetstone-ai, and the prelim scripts
# import gepa and httpx, which the `optim` extra installs only on Python
# 3.13+. The 3.12 check therefore type-checks these files without them, so
# the imports are unresolvable there by construction and nowhere else.
include = [
    "src/whetstone_envs/optim/**",
    "src/whetstone_envs/evaluation/**",
    "tests/optim/**",
    "examples/**",
    "scripts/prelim/**",
]
[tool.ty.overrides.rules]
unresolved-import = "ignore"
