[project]
name = "whetstone-envs"
version = "0.1.0"
description = "Task generators, independent oracles, and probe prompts for whetstone's quick-test optimizer benchmarks."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "absl-py>=2.5.0",
    "immutabledict>=4.3.1",
    "langdetect>=1.0.9",
    "minigrid>=3.1.0",
    "nltk>=3.10.0",
    "pydantic>=2.13.4",
    "typer>=0.27.0",
    "rfc8785>=0.1.4",
    "scipy>=1.11.0",
]

[project.urls]
Repository = "https://github.com/danielle-rothermel/whetstone-envs"
Issues = "https://github.com/danielle-rothermel/whetstone-envs/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.18",
    "ty>=0.0.51",
]

[tool.hatch.build.targets.sdist]
only-include = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/whetstone_envs"]
# The c18 subprocess boundary reads the vendored prontoqa generator by
# file path (it runs `run_experiment.py` as a subprocess), so the vendored
# non-Python data files must ship inside the wheel alongside the package.
artifacts = [
    "src/whetstone_envs/c18/_vendor/prontoqa/bad_patterns.txt",
    "src/whetstone_envs/c18/_vendor/prontoqa/LICENSE",
    "src/whetstone_envs/c18/_vendor/prontoqa/PROVENANCE.md",
    "src/whetstone_envs/c23/_vendor/inductionbench/LICENSE",
    "src/whetstone_envs/c23/_vendor/inductionbench/PROVENANCE.md",
    "src/whetstone_envs/c23/_vendor/inductionbench/VENDORED_DIFF.patch",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py"]
# Vendored snapshots retain upstream formatting and are covered by their
# provenance records and regression suites instead of first-party lint.
extend-exclude = [
    "src/whetstone_envs/c22/_vendor/**",
    "src/whetstone_envs/c18/_vendor/**",
    "src/whetstone_envs/c23/_vendor/**",
]
line-length = 79

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "E",
    "F",
    "FA",
    "FBT",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "PT",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLOT",
    "T10",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = ["PLR1711", "S101", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "PLC0415"]
# c19 tests build ASCII grid fixtures as newline-joined lists, which reads
# far better than a single embedded-newline literal (FLY002 would collapse
# them). E501/RUF001 cover the verbatim spec answer lines pinned by the
# byte-for-byte render test.
"tests/c19/test_oracle.py" = ["FLY002"]
"tests/c19/test_prompts.py" = ["FLY002", "E501", "RUF001"]
"tests/c19/test_scoring_integration.py" = ["FLY002"]
# The c22 probe prompts are copied verbatim from the baseline spec's
# drafted text (Section 2); reflowing them to <=79 cols would break the
# byte-for-byte render test. E501 is the only line-length rule that
# applies to the triple-quoted template literals.
"src/whetstone_envs/c22/prompts.py" = ["E501"]
# c22 generation uses the stdlib ``random`` module deliberately and
# never for cryptographic purposes: reproducibility from a pinned seed is
# the entire point, so S311 (non-crypto RNG) does not apply.
"src/whetstone_envs/c22/generate.py" = ["S311"]
"src/whetstone_envs/c22/atoms.py" = ["S311"]
# c11 generation/strata use the stdlib ``random`` module deliberately for
# seed-pinned reproducibility, never cryptographically: S311 (non-crypto
# RNG) does not apply.
"src/whetstone_envs/c11/generate.py" = ["S311"]
"src/whetstone_envs/c11/strata.py" = ["S311"]
# The c11 probe prompts are copied verbatim from the baseline spec's
# drafted text (Section 2); reflowing them to <=79 cols would break the
# byte-for-byte render test, so E501 does not apply to the templates.
"src/whetstone_envs/c11/prompts.py" = ["E501"]
"tests/c11/test_prompts.py" = ["E501", "RUF001"]
# The c19 live-rollout command sampler uses the stdlib ``random`` module
# deliberately for seed-pinned reproducibility, never cryptographically:
# S311 (non-crypto RNG) does not apply.
"src/whetstone_envs/c19/envs.py" = ["S311"]
# The c19 ceiling probe body is copied verbatim from the baseline spec's
# drafted text (Section 2.2); reflowing it to <=79 cols would break the
# byte-for-byte render test, so E501 does not apply to that module.
"src/whetstone_envs/c19/prompts.py" = ["E501"]
# The c18 probe prompts are copied verbatim from the baseline spec's
# drafted text (Section 2); reflowing them to <=79 cols would break the
# byte-for-byte render test. RUF001 covers the spec's own U+2014 em dash.
"src/whetstone_envs/c18/prompts.py" = ["E501", "RUF001"]
"tests/c18/test_prompts.py" = ["E501", "RUF001"]
# The c18 subprocess boundary exposes every owner-open generation knob as
# a keyword-only argument (config surface); the arg count is intentional.
"src/whetstone_envs/c18/upstream.py" = ["PLR0913"]
# The c18 generator likewise exposes every generation axis (depth set,
# distractor knob + per-depth override, ontology, seed start, N) as a
# keyword-only argument; the arg count is the config surface, intentional.
"src/whetstone_envs/c18/generate.py" = ["PLR0913"]
# The c23 probe prompts are copied verbatim from the baseline spec's drafted
# text (Section 2); reflowing them to <=79 cols would break the byte-for-byte
# render test. RUF001 covers the spec's own U+2014 em dashes.
"src/whetstone_envs/c23/prompts.py" = ["E501", "RUF001"]
"tests/c23/test_prompts.py" = ["E501", "RUF001"]
# The c23 boundary + generator expose every owner-open generation knob as a
# keyword-only argument (config surface); the arg count is intentional. The
# boundary's query/demo draw uses the stdlib ``random`` deliberately for
# seed-pinned reproducibility, never cryptographically (S311).
"src/whetstone_envs/c23/upstream.py" = ["PLR0913", "S311"]
"src/whetstone_envs/c23/generate.py" = ["PLR0913"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = ["dataclasses.dataclass"]

[tool.ty.src]
include = ["src", "tests"]
# Vendored snapshots retain upstream annotations and are checked through
# their regression suites instead of the first-party type checker.
exclude = [
    "src/whetstone_envs/c22/_vendor/**",
    "src/whetstone_envs/c18/_vendor/**",
    "src/whetstone_envs/c23/_vendor/**",
]

[tool.ty.environment]
extra-paths = [
    "src/whetstone_envs/c23/_vendor/inductionbench",
]
