[project]
name = "whetstone-envs"
version = "0.1.0"
description = "Task generators, independent oracles, and probe prompts for whetstone's quick-test optimizer benchmarks."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "absl-py>=2.5.0",
    "immutabledict>=4.3.1",
    "langdetect>=1.0.9",
    "nltk>=3.10.0",
    "pydantic>=2.13.4",
    "typer>=0.27.0",
    "rfc8785>=0.1.4",
]

[project.urls]
Repository = "https://github.com/danielle-rothermel/whetstone-envs"
Issues = "https://github.com/danielle-rothermel/whetstone-envs/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.18",
    "ty>=0.0.51",
]

[tool.hatch.build.targets.sdist]
only-include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py"]
# The pinned IFEval snapshot retains upstream formatting; its complete
# import-isolation and exact-count patch is recorded alongside it.
extend-exclude = ["src/whetstone_envs/c22/_vendor/**"]
line-length = 79

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "E",
    "F",
    "FA",
    "FBT",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "PT",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLOT",
    "T10",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = ["PLR1711", "S101", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "PLC0415"]
# The c22 probe prompts are copied verbatim from the baseline spec's
# drafted text (Section 2); reflowing them to <=79 cols would break the
# byte-for-byte render test. E501 is the only line-length rule that
# applies to the triple-quoted template literals.
"src/whetstone_envs/c22/prompts.py" = ["E501"]
# c22 generation uses the stdlib ``random`` module deliberately and
# never for cryptographic purposes: reproducibility from a pinned seed is
# the entire point, so S311 (non-crypto RNG) does not apply.
"src/whetstone_envs/c22/generate.py" = ["S311"]
"src/whetstone_envs/c22/atoms.py" = ["S311"]
# c11 generation/strata use the stdlib ``random`` module deliberately for
# seed-pinned reproducibility, never cryptographically: S311 (non-crypto
# RNG) does not apply.
"src/whetstone_envs/c11/generate.py" = ["S311"]
"src/whetstone_envs/c11/strata.py" = ["S311"]
# The c11 probe prompts are copied verbatim from the baseline spec's
# drafted text (Section 2); reflowing them to <=79 cols would break the
# byte-for-byte render test, so E501 does not apply to the templates.
"src/whetstone_envs/c11/prompts.py" = ["E501"]
"tests/c11/test_prompts.py" = ["E501", "RUF001"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = ["dataclasses.dataclass"]

[tool.ty.src]
include = ["src", "tests"]
# The pinned IFEval snapshot retains upstream annotations and is checked
# through its regression suite instead of the first-party type checker.
exclude = ["src/whetstone_envs/c22/_vendor/**"]
