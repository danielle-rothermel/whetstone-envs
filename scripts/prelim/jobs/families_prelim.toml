# Prelim sweep over the task families. Expand into a queue with
#   uv run --no-sync python scripts/prelim/queue_make.py \
#     scripts/prelim/jobs/families_prelim.toml --queue <queue-dir>
# and start workers from the repository root with OPENROUTER_API_KEY set:
#   mise exec -- uv run --no-sync python scripts/prelim/queue_worker.py \
#     --queue <queue-dir>
# Search wall caps: 1800 s at 300 calls, 3600 s at 1000, 10800 s at 3000.
# Reflection model defaults to openai/gpt-5.4-nano unless a job sets one.
# The c23 jobs are naive screens; the refl-* jobs compare proposers on c18.

[queue]
command = ["uv", "run", "--no-sync", "python", "scripts/prelim/gepa_family.py"]
out_root = "~/drotherm/data/whetstone-envs/studies/families-prelim"

[[jobs]]
name = "c18-g41-mini-naive"
args = ["--family", "c18", "--arm", "naive", "--task-model", "openai/gpt-4.1-mini"]

[[jobs]]
name = "c18-g41-mini-formatfixed"
args = ["--family", "c18", "--arm", "format_fixed", "--task-model", "openai/gpt-4.1-mini"]

[[jobs]]
name = "c18-g41-mini-null-300"
args = ["--family", "c18", "--arm", "null", "--task-model", "openai/gpt-4.1-mini", "--max-metric-calls", "300", "--wall-cap-s", "1800"]

[[jobs]]
name = "c18-g41-mini-null-1000"
